<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Panel de administración</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-fondo font-sans text-base leading-relaxed text-texto antialiased">
  <header class="bg-linear-to-br from-cabecera to-hero text-white">
    <div class="mx-auto max-w-3xl px-4 pb-14 sm:px-6">
      <div class="flex items-center gap-3 py-4">
        <span class="grid size-9 place-items-center rounded-lg bg-white/15" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
        </span>
        <span id="marca" class="text-lg font-bold tracking-tight"></span>
        <span id="panel" class="ml-auto text-sm text-white/80"></span>
      </div>
      <h1 id="titulo" class="mt-3 text-3xl font-bold leading-tight tracking-tight sm:text-4xl"></h1>
    </div>
  </header>

  <main id="app" class="relative mx-auto -mt-8 w-full max-w-3xl flex-1 px-4 pb-10 sm:px-6" aria-busy="true">
    <div class="acciones mb-4 hidden justify-end gap-2 has-[button:not([hidden])]:flex">
      <button type="button" id="exportar" class="boton boton-secundario" hidden></button>
      <button type="button" id="salir" class="boton boton-secundario" hidden></button>
    </div>

    <p id="estado" class="rounded-xl bg-superficie p-4 shadow-md ring-1 ring-borde empty:hidden" role="status"></p>

    <section id="ingreso" class="mx-auto mt-2 max-w-md rounded-2xl bg-superficie p-6 shadow-md ring-1 ring-borde" hidden>
      <h2 id="ingreso-titulo" class="text-xl font-bold"></h2>
      <p id="ingreso-texto" class="mb-5 mt-2 text-suave"></p>
      <p id="ingreso-error" class="mb-4 font-semibold text-error" role="alert" hidden></p>
      <button type="button" id="ingresar" class="boton boton-google">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.4a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>
        <span id="ingresar-texto"></span>
      </button>
    </section>

    <section id="vista" aria-live="polite"></section>
  </main>

  <footer class="px-4 py-6 text-center text-sm text-suave"><p id="pie"></p></footer>
</body>
</html>
