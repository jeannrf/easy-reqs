<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Formulario de requerimientos</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="modulepreload" href="js/formulario.js">
  <script type="module" src="js/formulario.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-fondo font-sans text-base leading-relaxed text-texto antialiased">
  <header class="bg-linear-to-br from-cabecera to-hero text-white">
    <div class="mx-auto max-w-3xl px-4 pb-16 sm:px-6 sm:pb-20">
      <div class="flex items-center gap-3 py-4">
        <span class="grid size-9 place-items-center rounded-lg bg-white/15" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
        </span>
        <span id="marca" class="text-lg font-bold tracking-tight"></span>
      </div>
      <h1 id="titulo" class="mt-4 text-3xl font-bold leading-tight tracking-tight sm:mt-6 sm:text-4xl"></h1>
      <p id="instrucciones" class="mt-3 max-w-2xl text-base text-white/85 sm:text-lg"></p>
    </div>
  </header>

  <main id="app" class="relative mx-auto -mt-10 w-full max-w-3xl flex-1 px-4 pb-10 sm:px-6" aria-busy="true">
    <p id="mensaje-carga" class="rounded-xl bg-superficie p-4 shadow-md ring-1 ring-borde" role="status"></p>

    <div id="avance" class="sticky top-2 z-10 mb-4 rounded-xl bg-superficie p-4 shadow-md ring-1 ring-borde" hidden>
      <div class="flex flex-wrap items-baseline justify-between gap-x-4">
        <p id="avance-texto" class="font-bold"></p>
        <p id="avance-respondidas" class="text-sm text-suave"></p>
      </div>
      <div class="mt-2 h-2 overflow-hidden rounded-full bg-borde" aria-hidden="true">
        <div id="barra-relleno" class="h-full rounded-full bg-primario transition-all duration-300"></div>
      </div>
    </div>

    <form id="formulario" novalidate hidden>
      <div id="pasos"></div>

      <div id="resumen-errores" class="mt-4 rounded-xl border-l-4 border-error bg-error-fondo p-4" role="alert" tabindex="-1" hidden></div>

      <div id="error-envio" class="mt-4 rounded-xl border-l-4 border-error bg-error-fondo p-4" role="alert" hidden>
        <h2 id="error-envio-titulo" class="text-lg font-bold"></h2>
        <p id="error-envio-texto" class="my-2"></p>
        <button type="button" id="reintentar" class="boton boton-principal"></button>
      </div>

      <div class="mt-5 flex gap-3">
        <button type="button" id="anterior" class="boton boton-secundario flex-1 sm:min-w-40 sm:flex-none"></button>
        <button type="submit" id="siguiente" class="boton boton-principal flex-1 sm:ml-auto sm:min-w-40 sm:flex-none"></button>
      </div>
    </form>

    <section id="confirmacion" class="rounded-2xl border-l-4 border-exito bg-exito-fondo p-6 shadow-md focus:outline-none" tabindex="-1" hidden>
      <h2 id="confirmacion-titulo" class="text-2xl font-bold text-exito"></h2>
      <p id="confirmacion-texto" class="mt-3"></p>
      <p class="mt-3"><span id="confirmacion-referencia"></span> <strong id="numero-referencia" class="text-3xl"></strong></p>
      <button type="button" id="nuevo" class="boton boton-secundario mt-4"></button>
    </section>
  </main>

  <footer class="px-4 py-6 text-center text-sm text-suave"><p id="pie"></p></footer>
</body>
</html>
